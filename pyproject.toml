[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-control-system-server"
version = "0.1.0"
description = "Rocketry Flow Control System Server"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pyserial>=3.5",
    "LabJackPython>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = [
    "instrumentation",
    "mocks",
    "serial_controller",
    "thermocouple",
    "ws_server",
]

[tool.ruff.lint.per-file-ignores]
"contents/code/instrumentation.py" = ["C901", "F401", "W291", "W293"]
"contents/code/main.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contents/code"]

[tool.setuptools]
py-modules = []
