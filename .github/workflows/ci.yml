name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check shell script syntax and LF line endings
        run: |
          bash -n tools/*.sh contents/code/direct-eth-detect.sh
          python -c "import pathlib; bad=[str(p) for p in list(pathlib.Path('tools').glob('*.sh'))+[pathlib.Path('contents/code/direct-eth-detect.sh')] if b'\r\n' in p.read_bytes()]; assert not bad, f'CRLF found in: {bad}'"

      - name: Install server package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check contents/code tests

      - name: Run pytest
        run: pytest -v
